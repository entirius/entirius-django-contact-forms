[project]
name = "entirius-django-contact-forms"
version = "3.0.0"
description = "Forms Django module for Volkanos — contact forms, bookings, leads, ad-conversion uploads"
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski", email = "piotrb@entirius.com" },
    { name = "Paweł Kiełt", email = "cptshooter12@gmail.com" },
    { name = "Mateusz Baran", email = "mateuszbaranpv@gmail.com" },
    { name = "Michał Kloczkowski", email = "michal@kloczkowski.pl" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=4.0.0",
    "amqp>=5.0",
    "celery>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "marshmallow>=3.15,<4",
    "marshmallow-dataclass>=8.5.3",
    "pydantic[email]>=2.0",
    "cryptography>=44.0",
    "entirius-django-regional>=2.0.1",
    "entirius-django-utils>=2.0.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = [
    "pytest",
    "pytest-django",
    "factory_boy",
    "dj-database-url",
    "psycopg[binary]",
]
# Booking calendar backend: lazy import in services/calendar/factory.py only.
bookings = ["entirius-py-google-calendar-sdk>=2.0.0"]
# Click-conversion uploads: lazy import in services/conversions only.
google-ads = ["entirius-py-google-ads-sdk>=2.0.0"]
# Branded notification e-mails: soft import with no-op fallback (apps.is_installed guard).
email = ["entirius-django-email>=4.0.1"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-contact-forms"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_contact_forms"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["django_contact_forms"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
